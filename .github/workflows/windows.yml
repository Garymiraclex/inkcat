name: windows
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build windows/test/InkCat.Test.csproj -c Release -o out
      - run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          out\InkCat.Test.exe shots out\InkCat.exe
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InkCat
          path: |
            out/InkCat.exe
            shots
